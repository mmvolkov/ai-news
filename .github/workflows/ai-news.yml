name: AI-новости
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Ссылка на выпуск YouTube"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code
      - run: |
          # YouTube блокирует серверы GitHub без входа: cookies.txt берём из секрета, если он задан
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            export YTDLP_COOKIES="$RUNNER_TEMP/cookies.txt"
          fi
          python -m ai_news "$VIDEO_URL"
        env:
          VIDEO_URL: ${{ inputs.url }}
          # Ролик через Google: транскрипт — Gemini, название и описание — YouTube Data API
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          # Подписка Claude Pro/Max: токен из `claude setup-token`
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: issue
          path: issues/
